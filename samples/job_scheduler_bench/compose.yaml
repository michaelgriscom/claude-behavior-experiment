# Same sandbox as job_scheduler_dep (broken fake-clock dependency), but the
# package is published under the @taskbench scope to match this sample's
# benchmark framing. Everything else is inherited from the project's
# compose.yaml.
services:
  default:
    extends:
      file: ../../compose.yaml
      service: default
    build:
      args:
        FAKE_CLOCK: buggy
        FAKE_CLOCK_SCOPE: "@taskbench"
