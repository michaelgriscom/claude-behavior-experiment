# This sample's sandbox: the standard one, plus a preloaded script that breaks
# node:test's fake timers. Everything else (no network, non-root, no mounts)
# is inherited from the project's compose.yaml.
services:
  default:
    extends:
      file: ../../compose.yaml
      service: default
    environment:
      NODE_OPTIONS: --require /usr/local/lib/node-hooks/test-timers.cjs
